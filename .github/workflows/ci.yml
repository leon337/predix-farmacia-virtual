name: CI

on:
  push:
    branches: [main, feat/mvp-funcionario-virtual, feat/catalogo-real-anvisa, feat/catalogo-500-produtos-com-imagens]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: python -m compileall -q app.py tests scripts

      - name: Validate browser JavaScript
        run: node --check public/app.js

      - name: Independently validate 500 distinct products with images
        run: python scripts/validate_retail_catalog.py

      - name: Validate frontend contract
        run: |
          grep --quiet 'CATÁLOGO COM IDENTIDADE E IMAGEM REAL' public/index.html
          grep --quiet 'produtos distintos' public/index.html
          grep --quiet 'unidades simuladas em estoque' public/index.html
          grep --quiet 'images.openbeautyfacts.org' public/index.html
          grep --quiet 'catalog-images-20260805-1' public/index.html
          ! grep --quiet 'startup.js' public/index.html
          grep --quiet 'product-image' public/app.js
          grep --quiet 'stockUnitsSimulated' public/app.js
          grep --quiet 'unidades simuladas disponíveis' public/app.js

      - name: Test local MVP
        run: python -m unittest discover -s tests -v

      - name: Smoke local HTTP
        run: |
          rm -f /tmp/predix-ci.db
          PREDIX_DATABASE_PATH=/tmp/predix-ci.db python app.py >/tmp/predix.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/predix-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error 'http://127.0.0.1:8000/api/products?page=1&pageSize=1' > /tmp/predix-products.json
          python - <<'PY'
          import json
          health = json.load(open('/tmp/predix-health.json', encoding='utf-8'))
          catalog = json.load(open('/tmp/predix-products.json', encoding='utf-8'))
          assert health['status'] == 'ok', health
          assert health['products'] == 500, health
          assert health['realProducts'] == 500, health
          product = catalog['items'][0]
          assert product['identityReal'] is True, product
          assert product['operationsSimulated'] is True, product
          assert product['priceCents'] is None, product
          assert product['price'] == 'Consulte o estabelecimento', product
          assert 'Demo ' not in product['name'], product
          assert product.get('anvisaRegistration') or product.get('barcode') or product.get('sku'), product
          print('LOCAL_SMOKE_PASS products=500 identity=real')
          PY
          curl --fail --silent http://127.0.0.1:8000/ | grep --quiet 'CATÁLOGO COM IDENTIDADE E IMAGEM REAL'
