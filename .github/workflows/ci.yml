name: CI

on:
  push:
    branches: [main, feat/mvp-funcionario-virtual, feat/catalogo-real-anvisa]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q app.py tests scripts
      - name: Validate catalog artifact
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          path = Path('data/real_products.json')
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '322a842080af74e1cafeea0a98f0ea71a930ac442eadb1d6d9911e15b9b7cf34'
          payload = json.loads(raw)
          products = payload['products']
          assert len(products) == 500
          assert all(p['anvisaRegistration'] and p['manufacturer'] for p in products)
          assert all(p['priceCents'] is None for p in products)
          assert all(p['activeIngredient'] is None for p in products)
          assert not any('Demo ' in p['name'] for p in products)
          print('CATALOG_PASS products=500 identities=real prices=absent')
          PY
      - name: Test MVP
        run: python -m unittest discover -s tests -v
      - name: Smoke HTTP
        run: |
          rm -f /tmp/predix-ci.db
          PREDIX_DATABASE_PATH=/tmp/predix-ci.db python app.py >/tmp/predix.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/api/health > /tmp/predix-health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error 'http://127.0.0.1:8000/api/products?page=1&pageSize=1' > /tmp/predix-products.json
          python - <<'PY'
          import json
          health = json.load(open('/tmp/predix-health.json', encoding='utf-8'))
          catalog = json.load(open('/tmp/predix-products.json', encoding='utf-8'))
          assert health['status'] == 'ok', health
          assert health['products'] == 500, health
          assert health['realProducts'] == 500, health
          assert health['productsWithoutPrice'] == 500, health
          assert health['catalogIdentity'] == 'real', health
          product = catalog['items'][0]
          assert product['identityReal'] is True, product
          assert product['operationsSimulated'] is True, product
          assert product['anvisaRegistration'], product
          assert product['priceCents'] is None, product
          assert product['price'] == 'Consulte o estabelecimento', product
          assert 'Demo ' not in product['name'], product
          print('SMOKE_PASS products=500 identities=real prices=absent')
          PY
          curl --fail --silent http://127.0.0.1:8000/ | grep --quiet 'CATÁLOGO COM IDENTIDADE REAL'
