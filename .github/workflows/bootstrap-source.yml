name: Bootstrap MVP source

on:
  push:
    branches: [feat/mvp-funcionario-virtual]
    paths:
      - bootstrap/source.tar.gz.b64
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mvp-funcionario-virtual
          fetch-depth: 0
      - name: Materialize validated source tree
        run: |
          base64 --decode bootstrap/source.tar.gz.b64 > /tmp/predix-source.tar.gz
          tar -xzf /tmp/predix-source.tar.gz -C .
          rm -rf bootstrap .github/workflows/bootstrap-source.yml
      - name: Commit source tree
        run: |
          git config user.name "MCF Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: entregar MVP da Predix Farmácia Virtual"
          git push origin HEAD:feat/mvp-funcionario-virtual
