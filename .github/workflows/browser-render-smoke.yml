name: Browser Render Smoke

on:
  push:
    branches: [fix/frontend-render-real-browser, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_URL: https://predix-farmacia-virtual.onrender.com
      LEGACY_URL: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-farmacia
      API_HEALTH: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-api/api/health
      API_PRODUCTS: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-api/api/products?page=1&pageSize=24
    steps:
      - uses: actions/checkout@v4

      - name: Wait for safe frontend and bypass cache
        shell: bash
        run: |
          set -euo pipefail
          target="${WEB_URL}/?build=${GITHUB_SHA}&attempt=${GITHUB_RUN_ATTEMPT}"
          ready=false
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$target" --output deployed.html; then
              if grep --quiet 'PRODUTOS NÃO MEDICAMENTOSOS' deployed.html \
                && grep --quiet 'Saúde, higiene e cuidados pessoais' deployed.html \
                && grep --quiet 'layout-safe-20260806-2' deployed.html; then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = true
          ! grep --quiet 'data-view="reservation"' deployed.html
          ! grep --quiet 'reservation-form' deployed.html
          ! grep --quiet 'chat-form' deployed.html
          printf 'TARGET_URL=%s\n' "$target" >> "$GITHUB_ENV"

      - name: Validate HTTP headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --location --head \
            --header 'Cache-Control: no-cache, no-store, must-revalidate' \
            --header 'Pragma: no-cache' \
            "$TARGET_URL" | tr -d '\r')"
          content_type="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' | tail -1)"
          case "$content_type" in text/html*) ;; *) echo "INVALID_CONTENT_TYPE=$content_type"; exit 1 ;; esac

      - name: Validate legacy redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --head "$LEGACY_URL" | tr -d '\r')"
          status="$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')"
          location="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="location" {print $2}' | tail -1)"
          case "$status" in 301|302|307|308) ;; *) exit 1 ;; esac
          test "$location" = "$WEB_URL"

      - name: Validate API and sample image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 "$API_HEALTH" > health.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 "$API_PRODUCTS" > product.json
          python - <<'PY'
          import json, re
          health = json.load(open('health.json', encoding='utf-8'))
          catalog = json.load(open('product.json', encoding='utf-8'))
          assert health['status'] == 'ok', health
          assert health['productRecords'] == 500, health
          assert health['distinctProducts'] == 500, health
          assert health['productsWithImages'] == 500, health
          assert health['stockUnitsSimulated'] > 500, health
          assert len(catalog['items']) == 24, catalog
          assert catalog['total'] == 500, catalog
          for product in catalog['items']:
              assert re.fullmatch(r'\d{8,14}', product['barcode']), product
              assert product['imageUrl'].startswith('https://images.openbeautyfacts.org/'), product
              assert product['stockIsSimulated'] is True, product
              assert product['priceCents'] is None, product
          PY
          image_url="$(python -c "import json; print(json.load(open('product.json'))['items'][0]['imageUrl'])")"
          curl --fail --silent --show-error --location \
            --header 'Accept: image/*' \
            --header 'User-Agent: PredixBrowserSmoke/1.0' \
            "$image_url" --output sample-product-image.bin
          test "$(stat -c%s sample-product-image.bin)" -gt 1000
          file sample-product-image.bin | grep -Eqi 'image|jpeg|png|webp'

      - name: Render safe catalog with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" \
            --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-cache --disk-cache-size=1 \
            --run-all-compositor-stages-before-draw --window-size=390,1400 --virtual-time-budget=30000 \
            --screenshot=predix-mobile-safe-catalog.png "$TARGET_URL"
          "$browser" \
            --headless --no-sandbox --disable-gpu --disable-cache --disk-cache-size=1 \
            --virtual-time-budget=30000 --dump-dom "$TARGET_URL" > rendered.html
          python - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path

          class TextCollector(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts = []
              def handle_data(self, data): self.parts.append(data)

          html = Path('rendered.html').read_text(encoding='utf-8')
          collector = TextCollector(); collector.feed(html)
          visible = re.sub(r'\s+', ' ', ' '.join(collector.parts)).strip()

          assert 'Predix Farmácia Virtual' in visible
          assert 'PostgreSQL conectado' in visible
          assert 'PRODUTOS NÃO MEDICAMENTOSOS' in visible
          assert 'Saúde, higiene e cuidados pessoais' in visible
          assert '500 produtos distintos' in visible
          assert '500 produtos com imagem' in visible
          assert 'Produtos 1–24 de 500' in visible
          assert 'Código de barras' in visible
          assert 'Fonte da imagem' in visible
          assert 'unidades simuladas disponíveis' in visible
          assert 'Preparar reserva' not in visible
          assert 'Criar reserva' not in visible
          assert 'Atendimento informativo' not in visible
          assert html.count('class="product-card"') == 24
          assert html.count('class="product-image"') == 24
          assert html.count('class="product-image-wrap"') == 24
          assert html.count('class="product-card-body"') == 24
          assert html.count('data-real-source="true"') == 24
          assert 'data-load-error="true"' not in html
          assert '&lt;!doctype html&gt;' not in html
          print('SAFE_DOM_PASS cards=24 images=24 reservations=0 chat=0')
          PY
          test -s predix-mobile-safe-catalog.png

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predix-safe-layout-browser-evidence
          path: |
            predix-mobile-safe-catalog.png
            rendered.html
            deployed.html
            health.json
            product.json
            sample-product-image.bin
          if-no-files-found: warn
          retention-days: 30
