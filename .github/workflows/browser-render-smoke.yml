name: Browser Render Smoke

on:
  push:
    branches: [fix/frontend-render-real-browser, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEB_URL: https://predix-farmacia-virtual.onrender.com
      LEGACY_URL: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-farmacia
      API_HEALTH: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-api/api/health
      API_PRODUCTS: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-api/api/products?page=1&pageSize=1
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTTP headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --location --head "$WEB_URL" | tr -d '\r')"
          printf '%s\n' "$headers"
          content_type="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' | tail -1)"
          test -n "$content_type"
          case "$content_type" in
            text/html*) ;;
            *) echo "INVALID_CONTENT_TYPE=$content_type"; exit 1 ;;
          esac

      - name: Validate legacy redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --head "$LEGACY_URL" | tr -d '\r')"
          printf '%s\n' "$headers"
          status="$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')"
          location="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="location" {print $2}' | tail -1)"
          case "$status" in
            301|302|307|308) ;;
            *) echo "INVALID_LEGACY_STATUS=$status"; exit 1 ;;
          esac
          test "$location" = "$WEB_URL"
          printf 'LEGACY_REDIRECT=PASS\n'

      - name: Validate API real catalog
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_HEALTH" > health.json
          curl --fail --silent --show-error "$API_PRODUCTS" > product.json
          python - <<'PY'
          import json
          import re
          health = json.load(open('health.json', encoding='utf-8'))
          catalog = json.load(open('product.json', encoding='utf-8'))
          assert health['status'] == 'ok', health
          assert health['products'] == 500, health
          assert health['realProducts'] == 500, health
          assert health['productsWithoutPrice'] == 500, health
          assert health['catalogIdentity'] == 'real', health
          assert health['database'] == 'supabase-postgres', health
          product = catalog['items'][0]
          assert product['identityReal'] is True, product
          assert product['operationsSimulated'] is True, product
          assert product['anvisaRegistration'], product
          assert product['priceCents'] is None, product
          assert product['price'] == 'Consulte o estabelecimento', product
          assert not re.search(r'Demo\s+\d{3}', product['name'], re.I), product
          print(json.dumps({'health': health, 'sample': product}, ensure_ascii=False, indent=2))
          PY

      - name: Render with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --virtual-time-budget=15000 \
            --screenshot=predix-mobile-real-catalog.png \
            "$WEB_URL"
          "$browser" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --virtual-time-budget=15000 \
            --dump-dom \
            "$WEB_URL" > rendered.html
          grep --quiet 'Predix Farmácia Virtual' rendered.html
          grep --quiet 'PostgreSQL conectado' rendered.html
          grep --quiet '500 produtos reais' rendered.html
          grep --quiet 'CATÁLOGO COM IDENTIDADE REAL' rendered.html
          grep --quiet 'Registro Anvisa' rendered.html
          grep --quiet 'Consulte o estabelecimento' rendered.html
          grep --quiet 'FUNCIONÁRIO VIRTUAL' rendered.html
          ! grep --quiet 'CATÁLOGO SINTÉTICO' rendered.html
          ! grep -Eqi 'Demo [0-9]{3}|Composto demonstrativo|Predix Labs Simulação|Farma Exemplo Fictícia' rendered.html
          if grep --quiet '&lt;!doctype html&gt;' rendered.html; then
            echo 'RAW_HTML_VISIBLE=true'
            exit 1
          fi
          test -s predix-mobile-real-catalog.png
          printf 'BROWSER_RENDER=PASS\nMOBILE_SCREENSHOT=PASS\nREAL_CATALOG_VISIBLE=true\nRAW_HTML_VISIBLE=false\n'

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: predix-real-catalog-browser-evidence
          path: |
            predix-mobile-real-catalog.png
            rendered.html
            health.json
            product.json
          if-no-files-found: error
          retention-days: 30
