name: Browser Render Smoke

on:
  push:
    branches: [fix/frontend-render-real-browser, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_URL: https://predix-farmacia-virtual.onrender.com
      LEGACY_URL: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-farmacia
      API_HEALTH: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-api/api/health
      API_PRODUCTS: https://qylqyhxpwffiripcpjej.supabase.co/functions/v1/predix-api/api/products?page=1&pageSize=24
    steps:
      - uses: actions/checkout@v4

      - name: Wait for candidate frontend and bypass cache
        shell: bash
        run: |
          set -euo pipefail
          target="${WEB_URL}/?view=catalog&build=${GITHUB_SHA}&attempt=${GITHUB_RUN_ATTEMPT}"
          ready=false
          for attempt in $(seq 1 48); do
            printf 'FRONTEND_POLL attempt=%s target=%s\n' "$attempt" "$target"
            if curl --fail --silent --show-error --location \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "$target" --output deployed.html; then
              if grep --quiet 'CATÁLOGO COM IDENTIDADE E IMAGEM REAL' deployed.html \
                && grep --quiet 'unidades simuladas em estoque' deployed.html \
                && grep --quiet 'startup.js' deployed.html; then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          test "$ready" = true
          grep --quiet 'Predix Farmácia Virtual' deployed.html
          grep --quiet 'images.openbeautyfacts.org' deployed.html
          ! grep --quiet 'CATÁLOGO SINTÉTICO' deployed.html
          printf 'TARGET_URL=%s\n' "$target" >> "$GITHUB_ENV"
          printf 'FRONTEND_CANDIDATE_READY=PASS\n'

      - name: Validate HTTP headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --location --head \
            --header 'Cache-Control: no-cache, no-store, must-revalidate' \
            --header 'Pragma: no-cache' \
            "$TARGET_URL" | tr -d '\r')"
          printf '%s\n' "$headers"
          content_type="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="content-type" {print tolower($2)}' | tail -1)"
          case "$content_type" in
            text/html*) ;;
            *) echo "INVALID_CONTENT_TYPE=$content_type"; exit 1 ;;
          esac

      - name: Validate legacy redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --head "$LEGACY_URL" | tr -d '\r')"
          status="$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')"
          location="$(printf '%s\n' "$headers" | awk -F': ' 'tolower($1)=="location" {print $2}' | tail -1)"
          case "$status" in 301|302|307|308) ;; *) exit 1 ;; esac
          test "$location" = "$WEB_URL"

      - name: Validate API catalog and sample image
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API_HEALTH" > health.json
          curl --fail --silent --show-error "$API_PRODUCTS" > product.json
          python - <<'PY'
          import json
          import re
          health = json.load(open('health.json', encoding='utf-8'))
          catalog = json.load(open('product.json', encoding='utf-8'))
          assert health['status'] == 'ok', health
          assert health['productRecords'] == 500, health
          assert health['distinctProducts'] == 500, health
          assert health['productsWithImages'] == 500, health
          assert health['productsWithBarcode'] == 500, health
          assert health['stockUnitsSimulated'] > 500, health
          assert health['catalogIdentity'] == 'real-with-images', health
          assert health['productCountMeaning'] == 'distinct-product-records', health
          assert health['stockCountMeaning'] == 'simulated-units', health
          assert len(catalog['items']) == 24, catalog
          assert catalog['total'] == 500, catalog
          assert catalog['firstRecord'] == 1, catalog
          assert catalog['lastRecord'] == 24, catalog
          for product in catalog['items']:
              assert re.fullmatch(r'\d{8,14}', product['barcode']), product
              assert product['imageUrl'].startswith('https://images.openbeautyfacts.org/'), product
              assert product['imageSource'] == 'Open Beauty Facts', product
              assert product['stockIsSimulated'] is True, product
              assert product['priceCents'] is None, product
          print(json.dumps({'health': health, 'sample': catalog['items'][0]}, ensure_ascii=False, indent=2))
          PY
          image_url="$(python -c "import json; print(json.load(open('product.json'))['items'][0]['imageUrl'])")"
          curl --fail --silent --show-error --location \
            --header 'Accept: image/*' \
            --header 'User-Agent: PredixBrowserSmoke/1.0' \
            "$image_url" --output sample-product-image.bin
          test "$(stat -c%s sample-product-image.bin)" -gt 1000
          file sample-product-image.bin | grep -Eqi 'image|jpeg|png|webp'

      - name: Render catalog with headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --disable-cache \
            --disk-cache-size=1 \
            --run-all-compositor-stages-before-draw \
            --window-size=390,1200 \
            --virtual-time-budget=25000 \
            --screenshot=predix-mobile-products-with-images.png \
            "$TARGET_URL"
          "$browser" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-cache \
            --disk-cache-size=1 \
            --virtual-time-budget=25000 \
            --dump-dom \
            "$TARGET_URL" > rendered.html
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('rendered.html').read_text(encoding='utf-8')
          assert 'Predix Farmácia Virtual' in html
          assert 'PostgreSQL conectado' in html
          assert '500 produtos distintos' in html
          assert '500 produtos com imagem' in html
          assert 'unidades simuladas em estoque' in html
          assert 'CATÁLOGO COM IDENTIDADE E IMAGEM REAL' in html
          assert 'Código de barras:' in html
          assert 'Imagem: Open Beauty Facts' in html
          assert 'unidades simuladas disponíveis' in html
          assert 'Produtos 1–24 de 500' in html
          assert html.count('class="product-image"') == 24, html.count('class="product-image"')
          assert html.count('https://images.openbeautyfacts.org/') >= 24
          assert 'data-real-source="true"' in html
          assert 'data-load-error="true"' not in html
          assert 'CATÁLOGO SINTÉTICO' not in html
          assert not re.search(r'Demo\s+\d{3}|Composto demonstrativo|Predix Labs Simulação|Farma Exemplo Fictícia', html, re.I)
          assert '&lt;!doctype html&gt;' not in html
          print('DOM_IMAGES_PASS cards=24 external_images=24 fallback_errors=0')
          PY
          test -s predix-mobile-products-with-images.png
          printf 'BROWSER_RENDER=PASS\nMOBILE_SCREENSHOT=PASS\nPRODUCT_IMAGES_VISIBLE=true\nPRODUCT_RECORDS=500\n'

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predix-500-products-images-browser-evidence
          path: |
            predix-mobile-products-with-images.png
            rendered.html
            deployed.html
            health.json
            product.json
            sample-product-image.bin
          if-no-files-found: warn
          retention-days: 30
